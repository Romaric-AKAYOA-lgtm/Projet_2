{% extends 'template_base.html' %}

{% block contenue %}
<div class="container mt-4">
    <h1 class="text-center">Modifier une Visite</h1>

    <!-- Modale pour le formulaire de modification de visite -->
    <div class="modal fade" id="modifierVisiteModal" tabindex="-1" aria-labelledby="modifierVisiteModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-warning text-white">
                    <h5 class="modal-title" id="modifierVisiteModalLabel">Modifier la Visite</h5>
                </div>
                <div class="modal-body">
                    <form action="{% url 'visite:modifier' visite.id %}" method="POST">
                        {% csrf_token %}

                        {% if form.non_field_errors %}
                        <div class="alert alert-danger">
                            {{ form.non_field_errors|striptags }}
                        </div>
                        {% endif %}

                        <div class="mb-3">
                            <label for="visiteur" class="form-label">Sélectionner un visiteur</label>
                            <select class="form-select" name="visiteur" disabled>
                                <option value="">-- Sélectionner un visiteur --</option>
                                {% for visiteur in visiteurs %}
                                    <option value="{{ visiteur.id }}" {% if visiteur.id == visite.visiteur.id %}selected{% endif %}>
                                        {{ visiteur.nom }} {{ visiteur.prenom }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="date_visite" class="form-label">Date de Visite</label>
                            <input type="date" class="form-control" name="date_visite" value="{{ visite.date_visite|date:'Y-m-d' }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="heure_visite" class="form-label">Heure de Visite</label>
                            <input type="time" class="form-control" name="heure_visite" value="{{ visite.heure_visite|time:'H:i' }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="objet" class="form-label">Description</label>
                            <textarea class="form-control" name="objet" required>{{ visite.objet }}</textarea>
                        </div>

                        <div class="mb-3">
                            <label for="directeur" class="form-label">Sélectionner un directeur</label>
                            <select class="form-select" name="directeur" disabled>
                                <option value="">-- Sélectionner un directeur --</option>
                                {% for directeur in directeurs %}
                                    <option value="{{ directeur.id }}" {% if directeur.id == visite.directeur.id %}selected{% endif %}>
                                        {{ directeur.nom }} {{ directeur.prenom }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="statut" class="form-label">Statut</label>
                            <select class="form-select" name="statut" id="statut" required>
                                <option value="confirmé" {% if visite.statut == "confirmé" %}selected{% endif %}>Confirmé</option>
                                <option value="annulé" {% if visite.statut == "annulé" %}selected{% endif %}>Annulé</option>
                            </select>
                        </div>

                        <!-- Motif d'annulation (s'affiche seulement si le statut est "annulé") -->
                        <div class="mb-3">
                            <label for="motif_annulation" class="form-label">Motif d'annulation</label>
                            <select class="form-select" id="motif_annulation" name="motif_annulation" {% if visite.statut != 'annulé' %}disabled{% endif %}>
                                <option value="">Sélectionner un motif</option>
                                <option value="indisponible_directeur" {% if visite.motif_annulation == 'indisponible_directeur' %}selected{% endif %}>Indisponibilité du directeur</option>
                                <option value="ajourné_visiteur" {% if visite.motif_annulation == 'ajourné_visiteur' %}selected{% endif %}>Ajournement du visiteur</option>
                            </select>
                        </div>
                        
                        <div class="mb-3 text-end">
                            <a href="{% url 'visite:Visite' %}" class="btn btn-secondary">Retour</a>
                            <button type="submit" class="btn btn-warning">Modifier</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    // Fonction pour gérer l'activation du champ "Motif d'annulation"
    document.addEventListener('DOMContentLoaded', function () {
        var statutSelect = document.getElementById('statut');
        var motifSelect = document.getElementById('motif_annulation');
        
        // Activer ou désactiver le motif d'annulation selon le statut sélectionné
        function toggleMotifAnnulation() {
            if (statutSelect.value === 'annulé') {
                motifSelect.disabled = false;
            } else {
                motifSelect.disabled = true;
            }
        }

        // Appeler la fonction au chargement pour définir l'état initial
        toggleMotifAnnulation();

        // Écouter les changements du statut pour mettre à jour le champ du motif
        statutSelect.addEventListener('change', toggleMotifAnnulation);
        
        var modal = new bootstrap.Modal(document.getElementById('modifierVisiteModal'), {
            backdrop: 'static',
            keyboard: false
        });
        modal.show();
    });
</script>

{% endblock %}
